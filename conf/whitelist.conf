#=============================================================
# 检测白名单
#=============================================================
# 格式: 每行一个条目，支持以下匹配方式
#   - 绝对路径: 保护文件不被检测为可疑
#   - 容器名: 跳过该容器的运行时检测
#   - 匹配串: 在日志/进程遍历时跳过
#
# 说明:
#   1. 以 # 开头的行为注释
#   2. 空行忽略
#   3. 路径匹配为精确匹配（不是前缀匹配）
#   4. 修改后无需重启脚本，下次运行生效
#=============================================================

# ---------- 系统标准文件（一般不需要修改）----------
# AWS EC2 官方 authorized_keys 提示（默认已由脚本过滤，此处仅作示例）
# /root/.ssh/authorized_keys

# ---------- 业务白名单示例 ----------
# 请根据实际环境取消注释并修改

# --- Web 应用 ---
# /var/www/html/legacy/oldsafe.php
# /var/www/html/admin/debug-tool.php
# /opt/app/webapps/ROOT/health.jsp

# --- 定时任务 ---
# /etc/cron.d/business-backup
# /etc/cron.d/app-health-check
# /var/spool/cron/crontabs/appuser

# --- systemd 服务 ---
# /etc/systemd/system/custom-app.service
# /etc/systemd/system/docker-compose-stack.service

# --- 容器白名单 ---
# myapp-web
# myapp-db
# nginx-proxy
# jenkins-agent

# --- 系统管理 ---
# /usr/local/bin/legitimate-tool.sh
# /opt/monitoring/agent/collect.sh

# ---------- 已知良性特征 ----------
# 以下特征在特定环境下会被误报，加入白名单可减少噪声

# --- 云环境元数据 ---
# 169.254.169.254

# --- 内部 DNS/时间服务器 ---
# 10.0.0.1
# 10.0.0.2
