#=============================================================
# 响应动作保护名单
#=============================================================
# 格式: 每行一个条目
#   - 绝对路径: 保护文件不被隔离/修改权限
#   - container:<名称>: 保护容器不被处置
#
# 说明:
#   1. 名单中的目标即使用户确认是威胁，响应引擎也不会自动处置
#   2. 关键系统文件必须列入，避免脚本误操作导致系统不可用
#   3. 修改后下次运行生效
#=============================================================

# ---------- 系统关键文件（强烈建议保留）----------
/etc/passwd
/etc/shadow
/etc/group
/etc/gshadow
/etc/sudoers
/etc/sudoers.d
/etc/ssh/sshd_config
/etc/pam.d/system-auth
/etc/pam.d/password-auth
/etc/pam.d/sshd
/etc/ld.so.preload
/etc/fstab
/etc/crontab
/etc/hosts
/etc/resolv.conf
/etc/nsswitch.conf
/etc/login.defs

# ---------- 系统关键目录 ----------
/boot
/boot/grub2
/lib/modules
/usr/lib/systemd

# ---------- 关键业务文件（按需添加）----------
# /var/www/html/index.php
# /var/www/html/config/database.php
# /opt/app/config/application.yml
# /opt/app/bin/app.jar

# ---------- 关键容器（按需添加）----------
# container:nginx-proxy
# container:mysql-primary
# container:redis-sentinel
# container:business-api

# ---------- 管理服务 ----------
/etc/systemd/system/sshd.service
/etc/systemd/system/docker.service
/etc/systemd/system/auditd.service