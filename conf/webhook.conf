#=============================================================
# Webhook 通知配置
#=============================================================
# 格式: <名称>|<类型>|<URL>|<最低级别>|<启用>
# 类型: slack | teams | dingtalk | wechat | generic
# 级别: CRITICAL | HIGH | MEDIUM | LOW
#=============================================================

# 钉钉（加签方式）
安全告警|dingtalk|https://oapi.dingtalk.com/robot/send?access_token=你的access_token|CRITICAL|true

# Slack（可选）
# 运维|slack|https://hooks.slack.com/services/XXX/YYY/ZZZ|HIGH|true

#=============================================================
# 全局配置
#=============================================================
RATE_LIMIT_SECONDS=300
AGGREGATE_MAX_ITEMS=20
RETRY_TIMES=3
RETRY_DELAY=5
ASYNC_MODE=true