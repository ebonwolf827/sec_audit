#=============================================================
# 修复建议映射表
#=============================================================
# 格式: KEY=修复命令
#
# 说明:
#   1. KEY 与脚本中 show_remediation 调用的 key 对应
#   2. 修复命令中的 <占位符> 需人工替换
#   3. 命令仅作为建议，不自动执行（除非配合 --fix 或 --response-level）
#   4. 修改后下次运行生效
#=============================================================

#=============================================================
# 一、系统基线类
#=============================================================

# --- SSH 配置 ---
ssh_permitrootlogin=echo "PermitRootLogin no" >> /etc/ssh/sshd_config.d/99-hardening.conf && sshd -t && systemctl reload sshd
ssh_password_auth=echo "PasswordAuthentication no" >> /etc/ssh/sshd_config.d/99-hardening.conf && sshd -t && systemctl reload sshd
ssh_maxauthtries=echo "MaxAuthTries 4" >> /etc/ssh/sshd_config.d/99-hardening.conf && systemctl reload sshd
ssh_backdoor=cp /root/.ssh/authorized_keys /tmp/authorized_keys.bak && sed -i '<行号>d' /root/.ssh/authorized_keys

# --- 账户安全 ---
extra_root=userdel -r <用户名>
empty_pw=passwd -l <用户名>
uid_check=awk -F: '$3==0 && $1!="root"{print $1}' /etc/passwd

# --- 内核参数 ---
sysctl:net.ipv4.ip_forward=echo "net.ipv4.ip_forward = 0" >> /etc/sysctl.d/99-hardening.conf && sysctl --system
sysctl:kernel.randomize_va_space=echo "kernel.randomize_va_space = 2" >> /etc/sysctl.d/99-hardening.conf && sysctl --system
sysctl:kernel.dmesg_restrict=echo "kernel.dmesg_restrict = 1" >> /etc/sysctl.d/99-hardening.conf && sysctl --system
sysctl:net.ipv4.conf.all.accept_redirects=echo "net.ipv4.conf.all.accept_redirects = 0" >> /etc/sysctl.d/99-hardening.conf && sysctl --system

# --- 文件权限 ---
perm:/etc/passwd:644=chmod 644 /etc/passwd && chown root:root /etc/passwd
perm:/etc/shadow:640=chmod 640 /etc/shadow && chown root:root /etc/shadow
perm:/etc/ssh/sshd_config:600=chmod 600 /etc/ssh/sshd_config && chown root:root /etc/ssh/sshd_config
perm:/etc/crontab:600=chmod 600 /etc/crontab && chown root:root /etc/crontab
file_tampered=比对文件哈希与包管理器记录，必要时从备份恢复

# --- AWS 环境 ---
imdsv2=aws ec2 modify-instance-metadata-options --instance-id <实例ID> --http-tokens required --http-endpoint enabled
aws_creds=chmod 600 ~/.aws/credentials && chmod 700 ~/.aws

#=============================================================
# 二、Java 内存马类
#=============================================================

memshell_detected=检查 memory-shell-detector 报告，确认后使用 -r 参数移除: java -jar memory-shell-detector-cli.jar -r <类名> -p <PID>
memshell_jcmd=使用 memory-shell-detector -v <类名> -p <PID> 反编译审查可疑类
memshell_kmba=使用 KMBA 扫描并移除: java -jar KMBA.jar --cli --pid <PID>

#=============================================================
# 三、Rootkit 类
#=============================================================

kernel_module=lsmod | grep -iE 'hide|rootkit' && rmmod <模块名>
ld_preload=cat /etc/ld.so.preload 确认内容后: chattr -i /etc/ld.so.preload && rm /etc/ld.so.preload
suid_new=ls -la <文件路径> 确认后: chmod u-s <文件路径>
hidden_process=ls -la /proc/<PID>/ && cat /proc/<PID>/cmdline 取证后终止

#=============================================================
# 四、反弹 Shell 与 C2 类
#=============================================================

reverse_shell=立即隔离主机，取证后终止进程: kill -STOP <PID> && 保存证据 && kill -9 <PID>
c2_framework=检查进程详情并终止: cat /proc/<PID>/cmdline && kill -STOP <PID>
c2_port=确认远端 IP 归属，非业务则阻断: iptables -I OUTPUT -d <IP> -j DROP
beaconing=使用 tcpdump 抓包分析连接间隔: tcpdump -i eth0 host <IP> -w /tmp/beacon.pcap
dns_tunnel=检查 DNS 查询日志，阻断异常域名
hidden_binary=取证后删除: cp <文件> /tmp/evidence/ && rm -f <文件>
deleted_binary=检查 /proc/<PID>/maps 和 /proc/<PID>/exe 链接，取证后终止
systemd_backdoor=禁用并删除可疑服务: systemctl disable <服务名> && rm /etc/systemd/system/<服务名>.service
cron_backdoor=备份后移除可疑 crontab 条目: cp <文件> /tmp/evidence/ && sed -i '<行号>d' <文件>
anti_forensics=检测到反取证行为，立即隔离主机并保全证据

#=============================================================
# 五、Webshell 类
#=============================================================

webshell_yara=YARA 命中 Webshell 规则，立即隔离文件: cp <文件> /tmp/evidence/ && rm <文件>
webshell_php=PHP Webshell，隔离文件并检查上传接口日志
webshell_php_oneshell=一句话木马，立即删除并检查 Web 日志的上传请求
webshell_java=JSP Webshell，检查 webapps 目录和上传接口
webshell_jsp=JSP 脚本块执行，人工审查该文件
webshell_python=Python 后门，检查 WSGI 入口和文件写入权限
webshell_nodejs=Node.js 命令执行，检查 npm 依赖和路由定义
webshell_dotnet=.NET 后门，检查 bin 目录和配置文件
webshell_hidden=隐藏 Web 文件，立即删除: rm <文件>
webshell_elf=Web 目录中的 ELF 可执行文件，高度可疑，立即取证

#=============================================================
# 六、恶意软件类
#=============================================================

malware_yara=YARA 命中恶意软件规则，立即隔离主机并取证
install_trivy=安装 Trivy: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

#=============================================================
# 七、Web 日志类
#=============================================================

web_abnormal_method=限制 Nginx HTTP 方法: if ($request_method !~ ^(GET|POST|HEAD)$) { return 405; }
web_sqli=确认应用使用参数化查询，部署 WAF 规则
web_xss=确认输出编码，部署 WAF 规则
web_rce=立即隔离主机，排查 Webshell 落地文件
web_lfi=限制文件包含: location ~ \.\. { deny all; }
web_sensitive_path=禁止访问敏感路径: location ~ /\.(env|git|svn) { deny all; }
web_deserialization=升级 Shiro/Fastjson/Log4j 到安全版本
web_scanner=部署 WAF 或 fail2ban 封禁扫描器 IP
web_cc=Nginx 限速: limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;
web_dirscan=启用 fail2ban 封禁高频 404 IP
web_upload=限制上传类型，禁用 .jsp/.war 上传
tomcat_manager_access=限制 Tomcat 管理后台访问 IP，或删除 /manager 应用

#=============================================================
# 八、系统日志类
#=============================================================

log_SSH暴力破解=启用 fail2ban: apt install fail2ban && systemctl enable --now fail2ban
log_SSH无效用户=配置 AllowUsers/DenyUsers: echo "AllowUsers youruser" >> /etc/ssh/sshd_config
log_sudo未授权=检查 /etc/sudoers 和 /etc/sudoers.d/
log_sudo命令拒绝=确认用户权限: visudo -c
log_sudo认证失败=检查 sudo 日志确认是否为合法用户
log_用户创建=确认新增用户合法性: grep "useradd" /var/log/auth.log
log_用户删除=确认用户删除操作合规
log_用户组变更=确认组变更合规
log_密码修改=确认密码修改为授权操作
log_权限提升=检查 su 到 root 的操作合规性
log_SSH密钥添加=检查新增密钥指纹: ssh-keygen -lf ~/.ssh/authorized_keys
log_systemd服务变更=确认服务变更合规: systemctl list-units --type=service
log_cron任务变更=检查定时任务: crontab -l && cat /etc/cron.d/*
log_PAM认证失败=检查 PAM 配置: cat /etc/pam.d/common-auth
log_可能的反向Shell=立即隔离主机，对相关进程取证后终止
ssh_bruteforce=启用 fail2ban 自动封禁: apt install fail2ban && systemctl enable --now fail2ban
ssh_compromised=立即重置该 IP 对应用户的密码，检查 SSH 密钥

# --- 内核级日志 ---
install_auditd=安装 auditd: apt install auditd（Ubuntu）或 dnf install audit（RHEL）
start_auditd=启动 auditd: systemctl start auditd && systemctl enable auditd
auditd_backlog=增大审计缓冲区: auditctl -b 8192
auditd_rules_missing=部署 CIS 基线规则到 /etc/audit/rules.d/99-cis.rules 后执行 augenrules --load
log_file_owner=修复日志所有者: chown root:syslog <日志文件>
log_file_perm=修复日志权限: chmod 640 <日志文件>
log_immutable=为关键日志设置追加属性: chattr +a /var/log/auth.log
journal_fss=启用 journald FSS: 在 /etc/systemd/journald.conf 中设置 Seal=yes 后重启 journald
journal_persistent=启用持久化存储: 在 journald.conf 中设置 Storage=persistent
journal_tampered=journald 日志校验失败，立即取证: cp -r /var/log/journal /tmp/evidence/
kernel_taint=检查已加载模块: lsmod | grep -v "$(cat /lib/modules/$(uname -r)/modules.builtin | sed 's|.*/||;s|\.ko.*||' | tr '\n' '|')"
kernel_error=内核异常可能由漏洞利用触发，检查 dmesg
dmesg_clear=检测到内核缓冲区清空，立即取证: cat /dev/kmsg > /tmp/evidence/kmsg.log
dmesg_restrict=启用 dmesg 限制: sysctl -w kernel.dmesg_restrict=1
history_disabled=恢复历史记录: 从 .bashrc 中移除 unset HISTFILE
history_cleared=历史文件被清空，检查 auditd 中的 execve 记录
intrusion_confirmed=确认入侵，启动应急响应流程
privilege_escalation_chain=提权后执行可疑命令，立即取证进程树

#=============================================================
# 九、Nacos 类
#=============================================================

nacos_upgrade=升级 Nacos 到最新版本: https://github.com/alibaba/nacos/releases
nacos_enable_auth=开启鉴权: 非Docker 环境设置 nacos.core.auth.enabled=true；Docker 环境添加 NACOS_AUTH_ENABLE=true
nacos_jwt_key=设置自定义 JWT 密钥: 修改 nacos.core.auth.plugin.nacos.token.secret.key
nacos_server_identity=设置自定义 server.identity: 修改 nacos.core.auth.server.identity.key 和 value
nacos_default_password=立即修改默认密码: 登录控制台 → 权限控制 → 修改 nacos 用户密码
nacos_unauthorized=开启鉴权开关后重启 Nacos
nacos_bind_internal=在 application.properties 中设置 server.address=内网IP
nacos_public_exposure=限制 Nacos 端口公网访问: AWS 安全组仅允许内网
nacos_cve_2021_29441=升级 Nacos 到 1.4.1+ 版本，或开启鉴权并配置 server.identity
nacos_v3_bypass=升级 Nacos 到 3.2.4+ 版本
nacos_rce=升级 Nacos 到最新版本，开启鉴权，限制 removal/derby 接口
nacos_spring_check=确认 Spring Boot 版本，升级到修复 CVE-2024-38809 的版本
nacos_db_password=修改数据库密码为强密码（至少 16 位）
nacos_db_external=生产环境改用外部数据库（MySQL/PostgreSQL），禁用 Derby
nacos_run_as_root=使用专用低权限用户运行 Nacos: useradd -r -s /sbin/nologin nacos

#=============================================================
# 十、Docker 容器类
#=============================================================

docker_daemon_json=创建 /etc/docker/daemon.json: {"userland-proxy": false, "icc": false, "live-restore": true} && systemctl restart docker
docker_userland_proxy=在 daemon.json 中设置 "userland-proxy": false && systemctl restart docker
docker_icc=在 daemon.json 中设置 "icc": false && systemctl restart docker
docker_live_restore=在 daemon.json 中设置 "live-restore": true && systemctl restart docker
docker_socket_perm=chmod 660 /var/run/docker.sock && chown root:docker /var/run/docker.sock
docker_socket_mounted=禁止容器挂载 /var/run/docker.sock
docker_tcp_plain=关闭 Docker 的 TCP 2375 端口，或在 daemon.json 中启用 TLS
docker_data_dir_perm=chmod 710 /var/lib/docker && chown root:root /var/lib/docker
container_privileged=停止容器并移除 --privileged，改用 --cap-add
container_dangerous_mount=移除容器中的敏感路径挂载
container_host_pid=移除 --pid=host
container_dangerous_cap=移除危险 Capability
container_malicious_process=立即隔离容器: docker pause <容器名>
k8s_privileged_pod=移除 Pod 中的 securityContext.privileged: true
install_falco=安装 Falco: https://falco.org/docs/setup/

#=============================================================
# 十一、响应动作说明
#=============================================================

response_quarantine=文件已隔离至 /var/lib/sec_audit/response/quarantine/，可通过 chattr -i 解除
response_kill=进程已终止，证据保存至 /var/lib/sec_audit/response/evidence/
response_block_ip=IP 已封禁，解除: iptables -D INPUT -s <IP> -j DROP && iptables -D OUTPUT -d <IP> -j DROP
response_lock_account=账户已锁定，解除: usermod -U <用户> && usermod -s /bin/bash <用户>
response_isolate=主机已隔离，恢复: iptables -F INPUT
